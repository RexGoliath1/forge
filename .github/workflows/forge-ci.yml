name: Forge RL Daemon CI

on:
  push:
    branches: [feature/rl-daemon-mode]
  pull_request:
    branches: [feature/rl-daemon-mode]

jobs:
  compile:
    name: Compile & Smoke Test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'maven'

      - name: Install Xvfb
        run: command -v Xvfb >/dev/null 2>&1 || { sudo apt-get update && sudo apt-get install -y xvfb; }

      - name: Compile
        run: mvn compile -DskipTests -Dcheckstyle.skip=true -q

      - name: Package JAR
        run: |
          export DISPLAY=":99"
          Xvfb :99 -screen 0 800x600x8 &
          sleep 2
          mvn package -DskipTests -Dcheckstyle.skip=true -q

      - name: Smoke test - daemon boots and listens
        run: |
          export DISPLAY=":99"

          # Find the built JAR
          JAR=$(find forge-gui-desktop/target -name "forge-gui-desktop-*.jar" -not -name "*sources*" -not -name "*javadoc*" | head -1)
          if [ -z "$JAR" ]; then
            echo "ERROR: Could not find forge JAR"
            exit 1
          fi
          echo "Found JAR: $JAR"

          # Start daemon in background
          java -jar "$JAR" daemon -p 17171 &
          DAEMON_PID=$!
          echo "Started daemon (PID: $DAEMON_PID)"

          # Wait for daemon to start listening (up to 30 seconds)
          for i in $(seq 1 30); do
            if nc -z localhost 17171 2>/dev/null; then
              echo "Daemon is listening on port 17171 (after ${i}s)"
              break
            fi
            if ! kill -0 $DAEMON_PID 2>/dev/null; then
              echo "ERROR: Daemon process died"
              exit 1
            fi
            sleep 1
          done

          # Verify we can connect
          if ! nc -z localhost 17171 2>/dev/null; then
            echo "ERROR: Daemon never started listening"
            kill $DAEMON_PID 2>/dev/null || true
            exit 1
          fi

          # Send a STATUS command and check we get a response
          RESPONSE=$(echo "STATUS" | nc -w 5 localhost 17171 2>/dev/null || true)
          echo "STATUS response: $RESPONSE"

          # Clean up
          kill $DAEMON_PID 2>/dev/null || true
          wait $DAEMON_PID 2>/dev/null || true
          echo "Smoke test passed: daemon boots and accepts connections"
