name: Forge RL Daemon CI

on:
  push:
    branches: [feature/rl-daemon-mode]
  pull_request:
    branches: [feature/rl-daemon-mode]

jobs:
  compile:
    name: Compile & Verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'maven'

      - name: Install Xvfb
        run: command -v Xvfb >/dev/null 2>&1 || { sudo apt-get update && sudo apt-get install -y xvfb; }

      - name: Compile
        run: mvn compile -DskipTests -Dcheckstyle.skip=true -q

      - name: Package JAR
        run: |
          export DISPLAY=":99"
          Xvfb :99 -screen 0 800x600x8 &
          sleep 2
          mvn package -DskipTests -Dcheckstyle.skip=true -q

      - name: Verify JAR and daemon classes
        run: |
          # Find the built JAR
          JAR=$(find forge-gui-desktop/target -name "forge-gui-desktop-*-jar-with-dependencies.jar" | head -1)
          if [ -z "$JAR" ]; then
            echo "ERROR: Could not find forge JAR"
            exit 1
          fi
          echo "Found JAR: $JAR ($(du -h "$JAR" | cut -f1))"

          # Verify our custom daemon classes exist in the JAR
          echo "Checking for RL daemon classes..."
          jar tf "$JAR" | grep -q "forge/view/ForgeDaemon.class" \
            && echo "  ForgeDaemon.class found" \
            || { echo "ERROR: ForgeDaemon.class missing"; exit 1; }

          jar tf "$JAR" | grep -q "forge/view/PlayerControllerAiObserver.class" \
            && echo "  PlayerControllerAiObserver.class found" \
            || { echo "ERROR: PlayerControllerAiObserver.class missing"; exit 1; }

          jar tf "$JAR" | grep -q "forge/view/LobbyPlayerAiObserver.class" \
            && echo "  LobbyPlayerAiObserver.class found" \
            || { echo "ERROR: LobbyPlayerAiObserver.class missing"; exit 1; }

          echo "All RL daemon classes verified in JAR"
