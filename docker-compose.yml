version: '3.8'

services:
  forge-daemon:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: forge-daemon
    ports:
      - "17171:17171"
    environment:
      - JAVA_OPTS=-Xmx2g -Djava.awt.headless=true
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "sh", "-c", "echo STATUS | nc -w 5 localhost 17171 | grep -q 'FORGE DAEMON STATUS'"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # For scaling training, you can run multiple daemons on different ports
  # forge-daemon-2:
  #   build: .
  #   ports:
  #     - "17172:17171"
  #   environment:
  #     - JAVA_OPTS=-Xmx2g -Djava.awt.headless=true
